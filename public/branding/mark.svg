<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="truce mark">
  <!-- Pink wave (positive phase) -->
  <path d="M 8 32 C 14 16, 22 16, 32 32 C 42 48, 50 48, 56 32"
        fill="none" stroke="#FF2D7B" stroke-width="6" stroke-linecap="round"/>
  <!-- Cyan wave (inverted phase) -->
  <path d="M 8 32 C 14 48, 22 48, 32 32 C 42 16, 50 16, 56 32"
        fill="none" stroke="#14F0E0" stroke-width="6" stroke-linecap="round"/>
  <!-- Truce point -->
  <circle cx="32" cy="32" r="3" fill="#F0E4D0"/>
</svg>
